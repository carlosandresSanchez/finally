# E2E: app (mock LLM, throwaway DB) + Playwright runner.
# Run from repo root: docker compose -f test/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from playwright
services:
  app:
    build: ..
    environment:
      LLM_MOCK: "true"
      MASSIVE_API_KEY: ""
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  playwright:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /e2e
    environment:
      BASE_URL: http://app:8000
      CI: "true"
    volumes:
      - ./:/e2e
      - /e2e/node_modules
    command: sh -c "npm install --no-audit --no-fund && npx playwright test"
    depends_on:
      app:
        condition: service_healthy
